# fly.toml app configuration file generated for happypet on 2026-05-10T18:26:34+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'happypet'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 4242
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
