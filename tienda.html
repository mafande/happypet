<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>Bienvenido a HappyPET</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="styles.css" />

<body>
  <header class="principal">
      <a href="index.html"><img src="img/logo.png" height="110" width="110" alt="logo" /></a>   
      <div class="header-titulo">
         <h1>Happy PET</h1>
         <div class="header-titulo2">
            <h2 class="centrar">Pequeños gestos, grandes huellas.</h2>
            <button id="cart-toggle" class="button-carrito">
              <img src="img/carrito2.png" height="30" width="30" alt="carrito">

           </button>
        </div>
      </div>
    </header> 
<p  class="breadcrump"><a href="index.html">Inicio</a> &gt; <a  class="negrita" href="#">tienda</a></p>
<div class="contenedor-productos">

      <a href="producto-s.html"><img src="img/producto.png" alt="Producto" /></a>
    </div>
    <div class="product-info">
      <h3>Dispensador S</h3>
      <p class="product-precio">Precio: 60 €</p>
      <button onclick="addToCart(1, 'Dispensador S', 60)" class="boton-add-carrito principal">Añadir al carrito</button>
    </div>
  </div>

  <div class="product">
    <div class="product_image">
      <a href="producto-m.html"><img src="img/producto.png" alt="Producto" /></a>
    </div>

      <h3>Dispensador M</h3>
      <p class="product-precio">Precio: 70 €</p>
      <button onclick="addToCart(2, 'Dispensador M', 70)" class="boton-add-carrito principal">Añadir al carrito</button>
    </div>
  </div>
</div><!--fin elemento contenedor productos -->
  
 <div class="contenedor-productos">
  <div class="product">
    <div class="product_image">
     <a href="producto-l.html"><img src="img/producto.png" alt="Producto" /></a>
    </div>

  <div class="product">

  </div>
</div><!--fin elemento contenedor productos -->
  
<!-- CARRITO -->
  <div id="cart-container">
    <h2>Carrito</h2>
    <ul id="cart"></ul>
    <p id="total"></p>
    <button id="buy-button" class="button-style principal">Comprar</button><!-- botón para comprar en el carrito -->
   
  </div>
